server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: haavk-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/haavk?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    # 本地开发默认值；生产环境请用环境变量 DB_USERNAME / DB_PASSWORD 覆盖
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:your-db-password}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml

# JWT 配置（生产环境务必通过环境变量覆盖）
haavk:
  jwt:
    secret: ${JWT_SECRET:haavk-dev-secret-key-please-change-in-production-0123456789}
    expire-minutes: 720
  # 开发默认后台账号（生产环境必须修改，建议改为数据库管理员表）
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}
    nickname: ${ADMIN_NICKNAME:集团管理员}
  upload:
    dir: ${UPLOAD_DIR:./uploads}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

logging:
  level:
    root: info
    com.haavk: debug
